backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Home" }
          - { label: "SEO Title", name: "seo_title", widget: "string", hint: "Browser tab title" }
          - { label: "SEO Description", name: "seo_description", widget: "text", hint: "Search engine description (150-160 chars)" }
          - { label: "Hero Label", name: "hero_label", widget: "string", hint: "Small text above the main heading" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string", hint: "Main hero heading" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text", hint: "Supporting text below the heading" }
          - { label: "Hero CTA Text", name: "hero_cta_text", widget: "string", hint: "Primary button text" }
          - { label: "Hero CTA URL", name: "hero_cta_url", widget: "string", hint: "Primary button link (e.g. Calendly URL)" }
          - { label: "Stat 1 Number", name: "hero_stat_1_number", widget: "string", hint: "Large number in stats card" }
          - { label: "Stat 1 Label", name: "hero_stat_1_label", widget: "string", hint: "Description below the number" }
          - { label: "Stat 2 Number", name: "hero_stat_2_number", widget: "string" }
          - { label: "Stat 2 Label", name: "hero_stat_2_label", widget: "string" }
          - { label: "Founder Quote", name: "hero_quote", widget: "text", hint: "Quote from Kate in the hero card" }
          - { label: "Quote Author", name: "hero_quote_author", widget: "string" }
          - { label: "Quote Role", name: "hero_quote_role", widget: "string" }
          - { label: "About Kate Heading", name: "kate_heading", widget: "string", hint: "Heading for the Kate section" }
          - { label: "About Kate Bio", name: "kate_bio", widget: "text", hint: "Short bio paragraph" }
          - { label: "About Kate Quote", name: "kate_quote", widget: "text", hint: "Blockquote text" }
          - { label: "Final CTA Heading", name: "cta_heading", widget: "string" }
          - { label: "Final CTA Text", name: "cta_text", widget: "text" }

      - name: "about"
        label: "About Page"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "About" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown", hint: "Kate's biography and the 'Why InKindRa exists' section" }

      - name: "services"
        label: "Services Page"
        file: "src/content/pages/services.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Services" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text" }

      - name: "how-it-works"
        label: "How It Works Page"
        file: "src/content/pages/how-it-works.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "How It Works" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text" }

      - name: "for-referrers"
        label: "For Referrers Page"
        file: "src/content/pages/for-referrers.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "For Referrers" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text" }

      - name: "packages"
        label: "Packages & Pricing Page"
        file: "src/content/pages/packages.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Packages" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text" }
          - { label: "Foundations Assessment Rate", name: "rate_foundations", widget: "string", hint: "e.g. £195 – £295" }
          - { label: "Navigator Retainer Rate", name: "rate_retainer", widget: "string", hint: "e.g. £199 – £349 / month" }
          - { label: "RN Advocacy Rate", name: "rate_advocacy", widget: "string", hint: "e.g. £60 – £90 / hour" }
          - { label: "Admin Support Rate", name: "rate_admin", widget: "string", hint: "e.g. £20 – £30 / hour" }
          - { label: "Mileage Rate", name: "rate_mileage", widget: "string", hint: "e.g. Standard HMRC rate" }

      - name: "contact"
        label: "Contact Page"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Contact" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Calendly URL", name: "calendly_url", widget: "string", hint: "Full Calendly booking link" }

      - name: "privacy"
        label: "Privacy Notice"
        file: "src/content/pages/privacy.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Privacy" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "string", hint: "e.g. Last updated date" }
          - { label: "Body", name: "body", widget: "markdown", hint: "Full privacy notice content" }

      - name: "faqs"
        label: "FAQs Page"
        file: "src/content/pages/faqs.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "FAQs" }
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - { label: "Hero Heading", name: "hero_heading", widget: "string" }
          - { label: "Hero Subheading", name: "hero_subheading", widget: "text" }
          - label: "FAQ Categories"
            name: "faq_categories"
            widget: "list"
            fields:
              - { label: "Category Name", name: "category", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }
